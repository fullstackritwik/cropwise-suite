<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgriTrack — Farm Operations Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --green-50:#eef7f0; --green-100:#dcefe1; --green-500:#2f7d47; --green-600:#276b3d; --green-700:#1f5631;
  --bg:#f6f7f6; --card:#ffffff; --ink:#12181d; --ink-2:#3b464f; --muted:#6b7681; --muted-2:#8c959e;
  --line:#e6e9e7; --line-2:#eff1ef;
  --amber-50:#fdf6e7; --amber-600:#a76a12; --amber-500:#c98a1c;
  --red-50:#fdeeed; --red-600:#b4322b;
  --blue-50:#eef3fb; --blue-600:#2f5fa8;
  --shadow-sm:0 1px 2px rgba(16,24,32,.05);
  --shadow:0 1px 3px rgba(16,24,32,.06),0 8px 24px -12px rgba(16,24,32,.14);
  --shadow-lg:0 24px 60px -20px rgba(16,24,32,.28);
  --r-sm:8px; --r:12px; --r-lg:16px;
  --sb:248px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  font-size:14px; line-height:1.5;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{flex:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d7dbd8;border:3px solid transparent;background-clip:content-box;border-radius:10px}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sb);flex:none;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  transition:width .22s cubic-bezier(.4,0,.2,1);z-index:60;
}
.app.collapsed .sidebar{--sb:72px}
.sb-head{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;height:64px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--green-500),var(--green-700));display:grid;place-items:center;color:#fff;flex:none}
.brand{font-weight:700;letter-spacing:-.02em;font-size:15px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted-2);letter-spacing:0}
.sb-toggle{margin-left:auto;width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:.15s}
.sb-toggle:hover{background:var(--bg);color:var(--ink)}
.nav{padding:8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;border:0;background:none;width:100%;text-align:left;color:var(--ink-2);font-weight:500;transition:.14s;position:relative;white-space:nowrap}
.nav-item:hover{background:var(--bg);color:var(--ink)}
.nav-item.on{background:var(--green-50);color:var(--green-700);font-weight:600}
.nav-item.on svg{color:var(--green-600)}
.nav-item svg{color:var(--muted)}
.nav-item .count{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted-2);background:var(--bg);border-radius:20px;padding:1px 7px}
.nav-item.on .count{background:#fff;color:var(--green-700)}
.sb-foot{border-top:1px solid var(--line-2);padding:8px;display:flex;flex-direction:column;gap:2px}
.me{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px}
.me:hover{background:var(--bg)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--green-600);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.me .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .rl{font-size:11px;color:var(--muted-2)}
.app.collapsed .hide-c{display:none!important}
.app.collapsed .nav-item,.app.collapsed .me{justify-content:center;padding:10px}
.app.collapsed .sb-head{justify-content:center;padding:18px 8px}
.app.collapsed .sb-toggle{display:none}
.app.collapsed .nav-item:hover::after{
  content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);
  background:#12181d;color:#fff;font-size:12px;font-weight:500;padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:99;box-shadow:var(--shadow)
}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;flex:none;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:40}
.hamb{display:none;width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;place-items:center}
.tb-search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 10px;height:34px;width:300px;max-width:38vw;color:var(--muted)}
.tb-search input{border:0;background:none;outline:0;width:100%;font-size:13px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip-date{font-size:12.5px;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;display:flex;gap:7px;align-items:center}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);position:relative;transition:.15s}
.icon-btn:hover{background:var(--bg)}
.dot{position:absolute;top:6px;right:7px;width:7px;height:7px;background:#c9402f;border-radius:50%;border:2px solid #fff}
.page{padding:26px 24px 56px;max-width:1440px;width:100%;margin:0 auto}

/* ---------- primitives ---------- */
.h1{font-size:21px;font-weight:700;letter-spacing:-.022em;margin:0}
.sub{color:var(--muted);margin:3px 0 0;font-size:13.5px}
.phead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--ink-2);transition:.15s;box-shadow:var(--shadow-sm)}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--green-600);border-color:var(--green-600);color:#fff}
.btn.pri:hover{background:var(--green-700)}
.btn.ghost{border-color:transparent;box-shadow:none;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--bg);color:var(--ink)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.danger{color:var(--red-600);border-color:#f0d8d6}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.card-h h3{margin:0;font-size:14px;font-weight:650;letter-spacing:-.01em}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.b-active{background:var(--green-50);color:var(--green-700);border-color:#cfe6d6}
.b-attention{background:var(--amber-50);color:var(--amber-600);border-color:#f0e2c1}
.b-completed{background:var(--blue-50);color:var(--blue-600);border-color:#d8e3f4}
.b-pending{background:#f2f3f2;color:#5d6771;border-color:#e2e5e2}
.b-neutral{background:#f2f3f2;color:#5d6771;border-color:#e2e5e2}
.b-yes{background:var(--green-50);color:var(--green-700);border-color:#cfe6d6}
.b-no{background:var(--red-50);color:var(--red-600);border-color:#f2dad8}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2);font-weight:600;text-align:left;padding:10px 16px;background:#fcfdfc;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer;transition:background .12s}
tr.click:hover{background:#fafbfa}
tr.click:hover .lk{color:var(--green-700)}
.lk{font-weight:600;color:var(--ink)}
.t2{font-size:12px;color:var(--muted-2)}
.mono{font-variant-numeric:tabular-nums}
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.crumb b{color:var(--ink-2);font-weight:600}
.crumb button{border:0;background:none;padding:0;color:var(--muted);font-weight:500}
.crumb button:hover{color:var(--green-700);text-decoration:underline}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty h4{margin:10px 0 4px;color:var(--ink);font-size:14px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:2px 14px}
.kv .k{color:var(--muted);font-size:12.5px;padding:7px 0}
.kv .v{font-weight:550;padding:7px 0;font-size:13.5px}
.kv>div{border-bottom:1px dashed var(--line-2)}
.kv>div:last-child,.kv>div:nth-last-child(2){border-bottom:0}
.sec-title{font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-2)}
.spin{width:15px;height:15px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skl{background:linear-gradient(90deg,#eef0ee,#f7f8f7,#eef0ee);background-size:200% 100%;animation:sh 1.1s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow-sm);transition:.16s}
.kpi:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.kpi .top{display:flex;align-items:center;gap:8px;color:var(--muted-2)}
.kpi .top span{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase}
.kpi .n{font-size:25px;font-weight:700;letter-spacing:-.03em;margin:8px 0 2px;line-height:1}
.kpi .d{font-size:11.5px;color:var(--muted)}
.kpi .up{color:var(--green-600);font-weight:600}
.kpi .warn{color:var(--amber-600);font-weight:600}

/* summary strip */
.sumgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.sum{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;box-shadow:var(--shadow-sm)}
.sum .l{font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-2)}
.sum .v{font-weight:650;margin-top:5px;font-size:14px;display:flex;align-items:center;gap:6px}

/* timeline */
.tl{position:relative;padding-left:8px}
.tl-day{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);margin:0 0 8px 26px}
.tl-item{position:relative;padding:0 0 16px 26px}
.tl-item::before{content:"";position:absolute;left:5px;top:16px;bottom:0;width:1px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-item .pt{position:absolute;left:0;top:5px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--green-500)}
.tl-item.g .pt{border-color:var(--muted-2)}
.tl-item.a .pt{border-color:var(--amber-500)}
.tl-t{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-d{color:var(--muted);font-size:13px;margin-top:2px}
.tl-m{font-size:12px;color:var(--muted-2);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}

/* donut + bars */
.donut{width:132px;height:132px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative}
.donut::after{content:"";position:absolute;inset:17px;background:#fff;border-radius:50%}
.donut .in{position:relative;z-index:1;text-align:center}
.donut .in b{display:block;font-size:22px;letter-spacing:-.03em}
.donut .in span{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:150px}
.lg{display:flex;align-items:center;gap:9px;font-size:13px}
.lg i{width:9px;height:9px;border-radius:3px;flex:none}
.lg b{margin-left:auto;font-variant-numeric:tabular-nums}
.lg span.p{color:var(--muted-2);font-size:12px;width:38px;text-align:right}
.bar{height:6px;border-radius:20px;background:var(--line-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green-500);border-radius:20px;transition:width .5s}

/* fertigation */
.fert{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.fcell{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;transition:.15s}
.fcell:hover{box-shadow:var(--shadow-sm)}
.fcell .no{font-size:10.5px;font-weight:700;color:var(--muted-2);display:flex;align-items:center;gap:5px}
.fcell .dt{font-size:12px;font-weight:600;margin-top:3px}
.fcell.done{background:var(--green-50);border-color:#cfe6d6}
.fcell.done .no{color:var(--green-700)}
.fcell.next{border-color:var(--amber-500);background:var(--amber-50)}
.fcell.next .no{color:var(--amber-600)}
.fcell.wait{background:#fbfcfb}
.fcell.wait .dt{color:var(--muted-2);font-weight:500}

/* drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(18,24,29,.34);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;backdrop-filter:blur(1.5px)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(500px,100%);background:#fff;z-index:90;transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.on{transform:none}
.dr-h{padding:18px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:flex-start;gap:12px}
.dr-h h3{margin:0;font-size:16px;letter-spacing:-.02em}
.dr-h p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.dr-b{padding:18px 20px;overflow-y:auto;flex:1}
.dr-f{padding:14px 20px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;background:#fcfdfc}
.fs{margin-bottom:20px}
.fs>.sec-title{display:block;margin-bottom:10px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:12px;font-weight:600;color:var(--ink-2)}
.f .req{color:#c9402f}
.f input,.f select,.f textarea{height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#fff;outline:0;transition:.15s;font-size:13.5px;width:100%}
.f textarea{height:72px;padding:8px 10px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--green-500);box-shadow:0 0 0 3px rgba(47,125,71,.13)}
.f .hint{font-size:11.5px;color:var(--muted-2)}
.f.err input,.f.err select{border-color:#d8564a;box-shadow:0 0 0 3px rgba(216,86,74,.12)}
.preview{background:var(--green-50);border:1px solid #cfe6d6;border-radius:var(--r);padding:12px 14px}
.preview .t{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--green-700)}
.preview .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px dashed #cfe6d6}
.preview .row:last-child{border-bottom:0}
.preview .row b{font-weight:650}
.modal{position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;width:min(440px,calc(100% - 32px));background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);transition:.2s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.toasts{position:fixed;bottom:20px;right:20px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{background:#12181d;color:#fff;border-radius:11px;padding:11px 14px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);animation:tin .22s ease-out;max-width:340px}
.toast .ic{width:18px;height:18px;border-radius:50%;background:var(--green-500);display:grid;place-items:center;flex:none}
.toast.warn .ic{background:var(--amber-500)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.fsearch{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;height:36px;padding:0 11px;min-width:280px;flex:1;max-width:400px;color:var(--muted);box-shadow:var(--shadow-sm)}
.fsearch input{border:0;background:none;outline:0;width:100%;font-size:13.5px}
select.fsel{height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 30px 0 11px;font-size:13px;font-weight:550;color:var(--ink-2);box-shadow:var(--shadow-sm);appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236b7681' stroke-width='2.2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 8px center}
select.fsel.act{border-color:#cfe6d6;background-color:var(--green-50);color:var(--green-700)}
.rescount{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:10px}
.rescount b{color:var(--ink)}
.two{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}
.two-eq{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.exp .card-h{cursor:pointer}
.exp .card-b{display:none}
.exp.open .card-b{display:block}
.exp .chev{transition:transform .18s;color:var(--muted)}
.exp.open .chev{transform:rotate(180deg)}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:12px;color:var(--ink-2);font-weight:550}
.people{display:flex;flex-direction:column;gap:2px}
.person{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.person:hover{background:#fafbfa}
.person .nm{font-weight:600;font-size:13px}
.hero{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.hero .t .h1{font-size:24px}
.hero-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:13px}
.big-av{width:52px;height:52px;border-radius:14px;background:linear-gradient(150deg,var(--green-500),var(--green-700));color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
@media(max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.sumgrid{grid-template-columns:repeat(3,1fr)}.two,.two-eq{grid-template-columns:1fr}}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .24s;box-shadow:var(--shadow-lg)}
  .app.drawer-open .sidebar{transform:none}
  .app.collapsed .sidebar{--sb:248px}
  .app.collapsed .hide-c{display:block!important}
  .app.collapsed .nav-item,.app.collapsed .me{justify-content:flex-start;padding:9px 10px}
  .hamb{display:grid}
  .page{padding:18px 14px 48px}
  .topbar{padding:0 14px}
  .tb-search{display:none}
  .frow{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:0}
  .kv>div{border-bottom:0}
  .kv .k{padding-bottom:0}
  .kv .v{padding-top:2px;border-bottom:1px dashed var(--line-2);padding-bottom:8px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .sumgrid{grid-template-columns:repeat(2,1fr)}
}

/* ---------------- toasts / dialogs ---------------- */
function toast(msg,warn){
  const t=document.createElement('div');
  t.className='toast'+(warn?' warn':'');
  t.innerHTML=`<span class="ic">${svg(warn?IC.alert:IC.check,11,3)}</span><span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity=0;t.style.transform='translateY(6px)';t.style.transition='.2s';setTimeout(()=>t.remove(),220);},2600);
}
const scrim=document.getElementById('scrim'), drawerEl=document.getElementById('drawer'), modalEl=document.getElementById('modal');
let drawerHooks={};
function openDrawer({title,sub,body,footer,onMount,onSubmit}){
  drawerEl.innerHTML=`
    <div class="dr-h"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div>
      <button class="icon-btn" data-close style="margin-left:auto">${svg(IC.x,15)}</button></div>
    <div class="dr-b">${body}</div>
    <div class="dr-f">${footer||''}</div>`;
  drawerHooks={onSubmit};
  scrim.classList.add('on'); drawerEl.classList.add('on');
  if(onMount) onMount(drawerEl);
}
function closeOverlays(){
  scrim.classList.remove('on'); drawerEl.classList.remove('on'); modalEl.classList.remove('on'); drawerHooks={};
}
scrim.onclick=closeOverlays;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlays();});
function confirmDialog(title,text,cta,fn,danger){
  modalEl.innerHTML=`<div style="padding:20px">
      <h3 style="margin:0 0 6px;font-size:16px;letter-spacing:-.02em">${esc(title)}</h3>
      <p style="margin:0;color:var(--muted);font-size:13.5px">${esc(text)}</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
        <button class="btn" data-close>Cancel</button>
        <button class="btn ${danger?'danger':'pri'}" data-confirm>${esc(cta)}</button>
      </div></div>`;
  scrim.classList.add('on'); modalEl.classList.add('on');
  modalEl.querySelector('[data-confirm]').onclick=()=>{closeOverlays();fn&&fn();};
}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-close]'); if(c){closeOverlays();return;}
  const n=e.target.closest('[data-nav]');
  if(n){const [p,a]=n.dataset.nav.split(':');go(p,a);return;}
  const ex=e.target.closest('.exp .card-h'); if(ex){ex.closest('.exp').classList.toggle('open');return;}
  const a=e.target.closest('[data-act]'); if(a){actions(a.dataset.act,a.dataset.arg,a);return;}
});

function farmTable(list,cols,emptyMsg){
  const head=['Farm',cols.includes('owner')&&'Owner',cols.includes('region')&&'Region',cols.includes('village')&&'Village',
    cols.includes('area')&&'Area',cols.includes('sup')&&'Supervisor','Status',cols.includes('last')&&'Last Activity',
    cols.includes('actions')&&'<span style="float:right">Actions</span>'].filter(Boolean);
  if(!list.length) return emptyState(emptyMsg||'No farms match the current filters.');
  return `<div class="tw"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${farmRows(list,cols)}</tbody></table></div>`;
}
function emptyState(msg,cta){
  return `<div class="empty">${svg(IC.farm,26,1.6)}<h4>Nothing here yet</h4><p style="margin:0;font-size:13px">${esc(msg)}</p>
   ${cta?`<div style="margin-top:14px">${cta}</div>`:''}</div>`;
}
function groupByDay(list){
  const g=[];
  list.forEach(a=>{
    const label = dayLabel(a.date);
    let last=g[g.length-1];
    if(!last||last.label!==label){last={label,items:[]};g.push(last);}
    last.items.push(a);
  });
  return g;
}
function dayLabel(iso){
  const t=NOW.toISOString().slice(0,10);
  const y=new Date(NOW); y.setDate(y.getDate()-1);
  if(iso===t)return 'Today';
  if(iso===y.toISOString().slice(0,10))return 'Yesterday';
  return iso2s(iso);
}
const TONE={'Fertigation':'', 'Farm Visit':'a','Inspection':'a','Sowing':'','Drip Installation':'','Weedicide':'g','Drenching':'g','Earthing Up':'g','Other':'g'};
function timeline(list,{withFarm=true}={}){
  if(!list.length) return emptyState('No activity recorded yet.');
  return `<div class="tl">`+groupByDay(list).map(g=>`
    <div class="tl-day">${g.label}</div>
    ${g.items.map(a=>`<div class="tl-item ${TONE[a.type]||''}"><span class="pt"></span>
      <div class="tl-t">${esc(a.type)} <span class="t2 mono">${a.time}</span></div>
      <div class="tl-d">${esc(a.desc)}</div>
      <div class="tl-m">${withFarm&&a.farm?`<span>${svg(IC.farm,12)} <button class="btn ghost sm" style="height:auto;padding:0" data-nav="farm:${a.farm.id}">${esc(a.farm.displayName)}</button></span>`:''}
        <span>Added by <b style="font-weight:600;color:var(--ink-2)">${esc(a.by)}</b></span>
        <span>${iso2s(a.date)}</span></div></div>`).join('')}
  `).join('')+`</div>`;
}

function filteredFarms(){
  const q=farmFilter.q.trim().toLowerCase();

    if(farmFilter.status && f.status!==farmFilter.status) return false;
    if(q && !(f.displayName+' '+f.owner+' '+f.village+' '+f.code+' '+f.region).toLowerCase().includes(q)) return false;
    return true;
  });

function vLogs(){
  let list=allActs();
  const q=logFilter.q.trim().toLowerCase();
  list=list.filter(a=>{
    if(logFilter.region && a.farm.region!==logFilter.region) return false;
    if(logFilter.sup && a.by!==logFilter.sup) return false;
    if(logFilter.type && a.type!==logFilter.type) return false;
    if(logFilter.date && a.date!==logFilter.date) return false;
    if(q && !(a.type+' '+a.desc+' '+a.by+' '+a.farm.displayName).toLowerCase().includes(q)) return false;
    return true;
  });
  const dirty=q||logFilter.region||logFilter.sup||logFilter.type||logFilter.date;
  const sups=logFilter.region?SUPERVISORS.filter(s=>s.region===logFilter.region):SUPERVISORS;
  view.innerHTML=`
   <div class="phead"><div><h1 class="h1">Activity Logs</h1><p class="sub">Every field update across regions, supervisors and farms.</p></div>
     <div class="acts"><button class="btn pri" data-act="addActivity">${svg(IC.plus,14,2.2)} Add Activity</button></div></div>
   <div class="filters">
     <div class="fsearch">${svg(IC.search,15)}<input id="lq" placeholder="Search activity, farm or supervisor…" value="${esc(logFilter.q)}"/></div>
     <select class="fsel ${logFilter.region?'act':''}" id="lr"><option value="">All Regions</option>${REGIONS.map(r=>`<option ${logFilter.region===r.name?'selected':''}>${r.name}</option>`).join('')}</select>
     <select class="fsel ${logFilter.sup?'act':''}" id="ls"><option value="">All Supervisors</option>${sups.map(s=>`<option ${logFilter.sup===s.name?'selected':''}>${s.name}</option>`).join('')}</select>

     <input class="fsel ${logFilter.date?'act':''}" type="date" id="ld" value="${logFilter.date}" style="padding:0 10px;background-image:none"/>

           return `<div><div class="lg" style="margin-bottom:5px">${t}<b>${n}</b></div><div class="bar"><i style="width:${n/mx*100}%"></i></div></div>`}).join('')}
       </div></div>
       <div class="card"><div class="card-h"><h3>Most active supervisors</h3></div><div class="card-b legend">
         ${SUPERVISORS.map(s=>({s,n:list.filter(a=>a.by===s.name).length})).sort((a,b)=>b.n-a.n).slice(0,5)

/* ---------------- actions: drawers & forms ---------------- */
function field(label,name,{type='text',req,val='',hint,options,placeholder}={}){
  if(options) return `<div class="f" data-f="${name}"><label>${label}${req?' <span class="req">*</span>':''}</label>
    <select name="${name}">${options.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>
    ${hint?`<span class="hint">${hint}</span>`:''}</div>`;
  return `<div class="f" data-f="${name}"><label>${label}${req?' <span class="req">*</span>':''}</label>
    <input name="${name}" type="${type}" value="${esc(val)}" placeholder="${esc(placeholder||'')}"/>${hint?`<span class="hint">${hint}</span>`:''}</div>`;
}
function actions(kind,arg,btn){
  if(kind==='addFarm') return farmDrawer(null,arg);
  if(kind==='editFarm') return farmDrawer(farmById(arg));
  if(kind==='addRegion') return regionDrawer();
  if(kind==='addOwner') return ownerDrawer();
  if(kind==='addSupervisor') return supDrawer(arg);
  if(kind==='addActivity') return activityDrawer(arg);
  if(kind==='fullTimeline') return timelineDrawer(arg);
  if(kind==='openOwner'){const [n,r]=arg.split('|');const o=owners().find(x=>x.name===n&&x.region===r);return go('owner',o.id);}
  if(kind==='reassign'){const s=SUPERVISORS.find(x=>x.id===arg);return assignDrawer(s);}
  if(kind==='readall'){closeOverlays();toast('All notifications marked as read');return;}
  if(kind==='noop'){toast('Not available in this demo',true);}
}
function submitBtn(label){return `<button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="saveBtn">${label}</button>`;}
function withSave(fn){
  const b=document.getElementById('saveBtn');
  b.onclick=()=>{
    const old=b.innerHTML; b.innerHTML=`<span class="spin"></span> Saving…`; b.disabled=true;
    setTimeout(()=>{ if(fn()===false){b.innerHTML=old;b.disabled=false;} },420);
  };
}
function vals(root){const o={};root.querySelectorAll('[name]').forEach(i=>o[i.name]=i.value.trim());return o;}
function markErr(root,names){
  root.querySelectorAll('.f').forEach(f=>f.classList.remove('err'));
  names.forEach(n=>{const f=root.querySelector(`[data-f="${n}"]`);if(f)f.classList.add('err');});
}

function farmDrawer(farm,presetRegion){
  const edit=!!farm;
  const regionNames=REGIONS.map(r=>r.name);
  const startRegion=edit?farm.region:(presetRegion||regionNames[0]);
  const supsFor=r=>SUPERVISORS.filter(s=>s.region===r).map(s=>s.name);
  openDrawer({
    title: edit?'Edit Farm':'Add Farm',
    sub: edit?`Farm #${farm.code} · ${farm.region}`:'Create a farm record and assign a supervisor.',
    body:`
      <div class="fs"><span class="sec-title">1 · Basic Information</span>
        ${field('Farm Name','name',{req:true,val:edit?farm.displayName:'',placeholder:'e.g. Chindhya Ganoba Gawande'})}
        <div class="frow">${field('Farm Code','code',{req:true,val:edit?farm.code:String(5880+FARMS.length)})}
        ${field('Mobile Number','mobile',{req:true,val:edit?farm.mobile:'',placeholder:'10-digit mobile'})}</div>
        ${field('Farm Owner','owner',{req:true,val:edit?farm.owner:'',placeholder:'Owner name as per record'})}
      </div>
      <div class="fs"><span class="sec-title">2 · Location</span>
        <div class="frow">${field('Region','region',{req:true,options:regionNames,val:startRegion})}
        ${field('Village','village',{req:true,val:edit?farm.village:'',placeholder:'e.g. Gouna'})}</div>
        ${field('Address','address',{val:edit?farm.address:'',placeholder:'Survey no., tehsil, district'})}
      </div>
      <div class="fs"><span class="sec-title">3 · Assignment</span>
        <div class="frow">${field('Supervisor','supervisor',{req:true,options:supsFor(startRegion),val:edit?farm.supervisor:'',hint:'Filtered by region'})}
        ${field('Area (Hac.)','area',{type:'number',req:true,val:edit?farm.area:'1'})}</div>
        ${field('Crop Type','crop',{options:['Plant','Ratoon'],val:edit?farm.crop:'Plant'})}
      </div>
      <div class="fs"><span class="sec-title">4 · Status</span>
        ${field('Farm Status','status',{options:Object.values(STLABEL),val:edit?STLABEL[farm.status]:'Active'})}
      </div>
      <div class="preview" id="prev"></div>`,
    footer: submitBtn(edit?'Save Changes':'Create Farm'),
    onMount(root){
      const rs=root.querySelector('[name=region]'), ss=root.querySelector('[name=supervisor]');
      const sync=()=>{
        const list=supsFor(rs.value);
        const keep=list.includes(ss.value)?ss.value:list[0];
        ss.innerHTML=list.map(n=>`<option ${n===keep?'selected':''}>${n}</option>`).join('');
        prev();
      };
      const prev=()=>{
        const v=vals(root);
        root.querySelector('#prev').innerHTML=`<div class="t">Before saving — review</div>
          ${[['Region',v.region],['Supervisor',ss.value],['Village',v.village||'—'],['Area',(v.area||'—')+' Hac.'],['Status',v.status]]
            .map(([k,x])=>`<div class="row"><span>${k}</span><b>${esc(x)}</b></div>`).join('')}`;
      };
      rs.onchange=sync; root.querySelectorAll('[name]').forEach(i=>i.addEventListener('input',prev)); ss.onchange=prev;
      sync();
      withSave(()=>{
        const v=vals(root);
        const miss=['name','code','mobile','owner','village','area'].filter(k=>!v[k]);
        if(miss.length){markErr(root,miss);toast('Please fill the required fields',true);return false;}
        const st=Object.keys(STLABEL).find(k=>STLABEL[k]===v.status)||'active';
        if(edit){
          Object.assign(farm,{displayName:v.name,name:v.name,code:v.code,mobile:v.mobile,owner:v.owner,region:v.region,
            village:v.village,address:v.address,supervisor:v.supervisor,area:parseFloat(v.area)||1,crop:v.crop,status:st,
            zonal:ZONAL[v.region],devTeam:DEVTEAM[v.region],devIncharge:DEVIC[v.region]});
          closeOverlays();renderNav();go('farm',farm.id);toast('Farm updated successfully');
        }else{
          const nf={id:'f'+v.code+Math.floor(Math.random()*90),displayName:v.name,name:v.name,code:v.code,owner:v.owner,mobile:v.mobile,
            region:v.region,village:v.village,area:parseFloat(v.area)||1,crop:v.crop,supervisor:v.supervisor,zonal:ZONAL[v.region],
            devTeam:DEVTEAM[v.region],devIncharge:DEVIC[v.region],status:st,address:v.address||`${v.village}, Dist. Betul (M.P.)`,
            dripSurveyDate:null,dripCompany:'—',quotation:Math.round(105000*(parseFloat(v.area)||1)),agreement:'NO',poToCompany:'NO',
            dripDelivered:'NO',dripInstalled:'NO',plough:'NO',rowDistance:'5 ft',dairyPreparation:'NO',sowingDate:null,
            seedDetails:'—',seedTreatment:'NO',basalDose:'NO',drenching:'NO',weedicide:'NO',liteEarthing:null,mediumEarthing:null,
            heavyEarthing:null,soilType:'Medium black',waterSource:'Bore well',plantsPerAcre:8000,expectedYield:'—',
            fert:Array.from({length:24},(_,k)=>({no:k+1,date:null,done:false,dose:['NPK 19:19:19','Urea + SOP','12:61:00','00:52:34','Micronutrient mix'][k%5]})),
            activities:[{id:'a'+(ACT_ID++),type:'Other',desc:'Farm record created in AgriTrack',date:NOW.toISOString().slice(0,10),time:'10:30 AM',by:'Admin'}]};
          FARMS.unshift(nf);
          closeOverlays();renderNav();go('farm',nf.id);toast('Farm created successfully');
        }
      });
    }
  });
}
function regionDrawer(){
  openDrawer({title:'Add Region',sub:'Create a geographic area to group farms.',
    body:`<div class="fs"><span class="sec-title">Region details</span>
      ${field('Region Name','name',{req:true,placeholder:'e.g. Amla'})}
      <div class="frow">${field('Region Code','code',{req:true,val:'REG-0'+(REGIONS.length+1)})}
      ${field('Status','status',{options:['Active','Inactive']})}</div>
      ${field('District / State','district',{val:'Betul, Madhya Pradesh'})}</div>`,
    footer:submitBtn('Create Region'),
    onMount(root){withSave(()=>{
      const v=vals(root); if(!v.name||!v.code){markErr(root,['name','code'].filter(k=>!v[k]));toast('Region name and code are required',true);return false;}
      REGIONS.push({id:'r'+Date.now(),name:v.name,code:v.code,district:v.district,status:v.status});
      closeOverlays();renderNav();go('regions');toast('Region created successfully');
    });}});
}
function ownerDrawer(){
  openDrawer({title:'Add Farm Owner',sub:'Owners are mapped to farms in a region.',
    body:`<div class="fs"><span class="sec-title">Owner details</span>
      ${field('Owner Name','name',{req:true})}
      <div class="frow">${field('Mobile Number','mobile',{req:true})}${field('Region','region',{options:REGIONS.map(r=>r.name)})}</div>
      ${field('Village','village',{req:true})}</div>
      <div class="fs"><span class="sec-title">Map to farm (optional)</span>
      ${field('Existing farm','farm',{options:['— none —',...FARMS.map(f=>f.displayName+' · #'+f.code)]})}</div>`,
    footer:submitBtn('Create Owner'),
    onMount(root){withSave(()=>{
      const v=vals(root); const miss=['name','mobile','village'].filter(k=>!v[k]);
      if(miss.length){markErr(root,miss);toast('Please fill the required fields',true);return false;}
      if(v.farm&&v.farm!=='— none —'){const code=v.farm.split('#')[1];const f=FARMS.find(x=>x.code===code);if(f){f.owner=v.name;f.mobile=v.mobile;}}
      closeOverlays();renderNav();go('owners');toast('Farm owner created successfully');
    });}});
}
function supDrawer(presetRegion){
  openDrawer({title:'Add Supervisor',sub:'Assign a supervisor to a region and farms.',
    body:`<div class="fs"><span class="sec-title">Supervisor details</span>
      ${field('Full Name','name',{req:true})}
      <div class="frow">${field('Mobile Number','mobile',{req:true})}${field('Role','role',{options:['Circle Supervisor','Field Supervisor','Zonal In-Charge']})}</div>
      ${field('Region','region',{options:REGIONS.map(r=>r.name),val:presetRegion||REGIONS[0].name})}
      ${field('Status','status',{options:['Active','On leave']})}</div>`,
    footer:submitBtn('Create Supervisor'),
    onMount(root){withSave(()=>{
      const v=vals(root); const miss=['name','mobile'].filter(k=>!v[k]);
      if(miss.length){markErr(root,miss);toast('Name and mobile are required',true);return false;}
      SUPERVISORS.push({id:'s'+Date.now(),name:v.name,region:v.region,role:v.role,mobile:v.mobile,status:v.status,since:NOW.toISOString().slice(0,10)});
      closeOverlays();renderNav();go('supervisors');toast('Supervisor assigned successfully');
    });}});
}
function assignDrawer(s){
  const pool=FARMS.filter(f=>f.region===s.region&&f.supervisor!==s.name);
  openDrawer({title:'Assign Farm',sub:`${s.name} · ${s.region}`,
    body: pool.length?`<div class="fs"><span class="sec-title">Farm</span>
      ${field('Farm','farm',{options:pool.map(f=>f.displayName+' · #'+f.code)})}
      <span class="hint">Only farms in ${s.region} are shown.</span></div>`:emptyState('Every farm in this region is already assigned to '+s.name+'.'),
    footer: pool.length?submitBtn('Assign Farm'):`<button class="btn" data-close>Close</button>`,
    onMount(root){ if(!pool.length)return; withSave(()=>{
      const v=vals(root);const code=v.farm.split('#')[1];const f=FARMS.find(x=>x.code===code);
      if(f)f.supervisor=s.name;
      closeOverlays();go('supervisor',s.id);toast('Supervisor assigned successfully');
    });}});
}
function activityDrawer(farmId){
  const f=farmId?farmById(farmId):null;
  openDrawer({title:'Add Activity',sub:f?`${f.displayName} · Farm #${f.code}`:'Log a field update against a farm.',
    body:`<div class="fs"><span class="sec-title">Activity</span>
      ${f?'':field('Farm','farm',{options:FARMS.map(x=>x.displayName+' · #'+x.code)})}
      ${field('Activity Type','type',{options:ACT_TYPES,val:'Fertigation'})}
      <div class="frow">${field('Date','date',{type:'date',val:NOW.toISOString().slice(0,10),req:true})}
      ${field('Time','time',{type:'time',val:'10:30'})}</div>
      <div class="f" data-f="desc"><label>Description <span class="req">*</span></label>
        <textarea name="desc" placeholder="e.g. First fertigation completed with NPK 19:19:19"></textarea></div>
      ${field('Added By','by',{options:SUPERVISORS.map(s=>s.name).concat('Admin'),val:f?f.supervisor:'Admin'})}
      ${field('Update farm status to','status',{options:['— no change —',...Object.values(STLABEL)]})}
    </div>`,
    footer:submitBtn('Add Activity'),
    onMount(root){withSave(()=>{
      const v=vals(root);
      if(!v.desc){markErr(root,['desc']);toast('Please add a short description',true);return false;}
      const target = f || FARMS.find(x=>x.code===v.farm.split('#')[1]);
      const [h,m]=(v.time||'10:30').split(':').map(Number);
      const t=`${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;
      target.activities.unshift({id:'a'+(ACT_ID++),type:v.type,desc:v.desc,date:v.date,time:t,by:v.by});
      target.activities.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
      if(v.status&&v.status!=='— no change —') target.status=Object.keys(STLABEL).find(k=>STLABEL[k]===v.status);
      if(v.type==='Fertigation'){const n=target.fert.find(x=>!x.done); if(n){n.done=true;n.date=v.date;}}
      closeOverlays();go('farm',target.id);toast('Activity added successfully');
    });}});
}
function timelineDrawer(farmId){
  const f=farmById(farmId);
  openDrawer({title:'Full Activity Timeline',sub:`${f.displayName} · ${f.activities.length} entries`,
    body:`<div class="tw" style="margin-bottom:14px"><table style="min-width:auto"><thead><tr><th>Date</th><th>Time</th><th>Activity</th><th>Added by</th></tr></thead>
      <tbody>${f.activities.map(a=>`<tr><td class="mono t2">${iso2s(a.date)}</td><td class="mono t2">${a.time}</td>
        <td><div style="font-weight:600">${esc(a.type)}</div><div class="t2">${esc(a.desc)}</div></td><td class="t2">${esc(a.by)}</td></tr>`).join('')}</tbody></table></div>
      ${timeline(f.activities,{withFarm:false})}`,
    footer:`<button class="btn ghost" data-close>Close</button><button class="btn pri" data-act="addActivity" data-arg="${f.id}">${svg(IC.plus,14,2.2)} Add Activity</button>`});
}

/* boot */
renderNav(); render();
</script>
</body>
</html>
